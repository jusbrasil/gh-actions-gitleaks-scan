name: secret-scan-gate
on:
  workflow_call:
    inputs:
      baseline-path:
        type: string
        default: "gitleaks-baseline.json"
      config-path:
        type: string
        default: ""
      gitleaks-version:
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      fail-on-finding:
        type: boolean
        default: true
        description: "When false, a finding logs a warning instead of failing the job (observation mode). Execution errors still fail."
      gate-timeout-minutes:
        type: number
        default: 15
        description: "Round-3 review fix: without this, the gate — a required check — inherits GitHub's 360-minute default and can hold every PR hostage on a hung/oversized schedule scan of a large repo."

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.gate-timeout-minutes }}
    steps:
      # Fixed by round-5 review: this has to run BEFORE checkout, not inside
      # the composite action's own first step — timeout-minutes counts from
      # the job's actual start, and a large repo's fetch-depth:0 checkout
      # can itself consume minutes that a later "job start" timestamp would
      # never account for, defeating the whole point of budgeting off the
      # real start.
      - shell: bash
        run: date +%s > "${{ runner.temp }}/.job-start-epoch"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jusbrasil/gh-actions-gitleaks-scan/.github/actions/gitleaks-scan@v1.0.0
        with:
          mode: gate
          fail-on-finding: ${{ inputs.fail-on-finding }}
          baseline-path: ${{ inputs.baseline-path }}
          config-path: ${{ inputs.config-path }}
          gitleaks-version: ${{ inputs.gitleaks-version }}
          gitleaks-sha256: ${{ inputs.gitleaks-sha256 }}
