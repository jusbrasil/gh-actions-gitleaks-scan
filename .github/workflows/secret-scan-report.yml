name: secret-scan-report
on:
  workflow_call:
    inputs:
      relay-url:
        type: string
        required: true
      relay-audience:
        type: string
        required: true
      baseline-path:
        type: string
        default: "gitleaks-baseline.json"
      config-path:
        type: string
        default: ""
      gitleaks-version:
        type: string
        default: "8.30.1"
      gitleaks-sha256:
        type: string
        default: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
      max-findings-per-run:
        type: number
        default: 500
      job-timeout-minutes:
        type: number
        default: 15

permissions:
  id-token: write
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.job-timeout-minutes }}
    steps:
      # Same reason as secret-scan-gate.yml (round-5 review fix): must run
      # before checkout, not inside the composite action's first step.
      - shell: bash
        run: date +%s > "${{ runner.temp }}/.job-start-epoch"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate required inputs are non-empty
        shell: bash
        env:
          RELAY_URL: ${{ inputs.relay-url }}
          RELAY_AUDIENCE: ${{ inputs.relay-audience }}
        run: |
          if [ -z "$RELAY_URL" ] || [ -z "$RELAY_AUDIENCE" ]; then
            echo "::error::relay-url e relay-audience precisam de valor não-vazio neste workflow"
            exit 1
          fi
      - uses: jusbrasil/gh-actions-gitleaks-scan/.github/actions/gitleaks-scan@v1.0.0
        with:
          mode: report
          relay-url: ${{ inputs.relay-url }}
          relay-audience: ${{ inputs.relay-audience }}
          baseline-path: ${{ inputs.baseline-path }}
          config-path: ${{ inputs.config-path }}
          gitleaks-version: ${{ inputs.gitleaks-version }}
          gitleaks-sha256: ${{ inputs.gitleaks-sha256 }}
          max-findings-per-run: ${{ inputs.max-findings-per-run }}
          job-timeout-minutes: ${{ inputs.job-timeout-minutes }}
